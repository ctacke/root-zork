name: Publish Zork

# Triggered by pushing a tag like "v1.0.2" or "zork-v1.0.2"
on:
  push:
    tags:
      - 'v*'
      - 'zork-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number override (e.g. 1.0.2)'
        required: false
        type: string

jobs:
  package-and-upload:
    runs-on: ubuntu-latest

    # Working directory for all run steps: the root-zork src/ workspace root
    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract & Update Version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref_name }}" =~ ^(zork-)?v?([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
            VERSION="${BASH_REMATCH[2]}"
          else
            VERSION=$(node -p "require('./root-manifest.json').version")
          fi
          echo "Building and publishing Zork version: $VERSION"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" root-manifest.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build package
        run: |
          mkdir -p ./dist
          npx rootsdk build package --output-file ./dist/zork.pkg

      - name: Upload package
        run: >-
          npx rootsdk upload package
          --file ./dist/zork.pkg
          --authToken "$ROOTSDK_AUTH_TOKEN"
          --host dev.rootapp.com
        env:
          ROOTSDK_AUTH_TOKEN: ${{ secrets.ROOTSDK_AUTH_TOKEN }}

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: zork-pkg
          path: src/dist/zork.pkg
